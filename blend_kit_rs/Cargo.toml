[package]
name = "blend_kit"
version = "0.1.1"
edition = "2021"
description = "豆哥配煤 - 配煤优化核心算法 (Rust)"
license = "MIT"

[lib]
name = "blend_kit"
crate-type = ["lib"]

[dependencies]
clarabel = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
# 性质测试 (tests/properties.rs). 只要 std: 不用 fork / timeout, 少拖一串依赖.
proptest = { version = "1", default-features = false, features = ["std"] }

[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
float_cmp = "deny"
# CI 历史上放行的写法, 与 CI 命令保持一致 (见 ci.yml 的 clippy 步骤).
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[[example]]
name = "demo"
path = "examples/demo.rs"
