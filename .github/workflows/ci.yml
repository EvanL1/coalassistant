# 豆哥配煤 - 持续集成 (跑测试, 不打包)
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: doudou_blend/package-lock.json

      - name: Install frontend dependencies
        working-directory: doudou_blend
        run: npm ci

      - name: Check repository consistency
        run: node scripts/check_repository_consistency.mjs

      - name: Check master data
        run: node scripts/check_master_data.mjs

      - name: Test frontend
        working-directory: doudou_blend
        run: npm test

      - name: Build frontend
        working-directory: doudou_blend
        run: npm run build

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            blend_kit_rs
            blend_kit_server

      - name: Test blend_kit
        working-directory: blend_kit_rs
        run: cargo test --release

      - name: Build blend_kit demo
        working-directory: blend_kit_rs
        run: cargo run --release --example demo

      - name: Build blend_kit master_demo
        working-directory: blend_kit_rs
        run: cargo run --release --example master_demo

      - name: Test Web server
        working-directory: blend_kit_server
        run: cargo test --locked

      - name: Format check
        run: |
          cargo fmt --manifest-path blend_kit_rs/Cargo.toml -- --check
          cargo fmt --manifest-path blend_kit_server/Cargo.toml -- --check

      - name: Clippy (blend_kit)
        working-directory: blend_kit_rs
        run: cargo clippy --release -- -D warnings

      - name: Clippy (Web server)
        working-directory: blend_kit_server
        run: cargo clippy --all-targets --locked -- -D warnings
