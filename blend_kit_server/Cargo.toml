[package]
name = "blend_kit_server"
version = "0.1.1"
edition = "2021"
description = "豆哥配煤 - Railway Web API 与静态站点服务"
license = "MIT"

[dependencies]
axum = "0.8"
blend_kit = { path = "../blend_kit_rs" }
serde = { version = "1", features = ["derive"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
serde_json = "1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
