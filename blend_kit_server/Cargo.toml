[package]
name = "blend_kit_server"
default-run = "blend_kit_server"
version = "0.1.1"
edition = "2021"
description = "豆哥配煤 - Railway Web API 与静态站点服务"
license = "MIT"

[dependencies]
axum = "0.8"
blend_kit = { path = "../blend_kit_rs" }
chrono = { version = "0.4", features = ["serde"] }
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "gzip"] }
serde = { version = "1", features = ["derive"] }
# float_roundtrip: 云端状态里的小数经存取后必须逐位不变, 前端靠它判断本机与云端是否一致.
serde_json = { version = "1", features = ["float_roundtrip"] }
md-5 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "json", "migrate", "macros"] }
subtle = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tower-http = { version = "0.6", features = ["compression-gzip", "fs", "set-header", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
http-body-util = "0.1"
tempfile = "3"
tower = { version = "0.5", features = ["util"] }

# 生产代码不许 unwrap / expect / panic: 能失败的地方走正常的错误处理; 确实不可能失败的
# (启动期的常量解析等) 用 #[expect(clippy::…, reason = "…")] 就地说明. 测试里放行, 见 clippy.toml.
[lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
# CI 历史上放行的写法, 与 CI 命令保持一致 (见 ci.yml 的 clippy 步骤).
uninlined_format_args = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "unwind"
strip = true
